<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Миний веб хуудас</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 80px auto;
            padding: 40px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #2563eb;
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
        }

        .name {
            font-weight: bold;
            color: #111827;
        }

        .subject {
            color: #2563eb;
            font-weight: bold;
        }
        a {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 28px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    transition: all 0.3s ease;
}

a:hover {
    transform: translateY(-3px);
    box-shadow: 0 7px 15px rgba(37, 99, 235, 0.4);
}
    </style>
</head>

<body>

    <div class="container">

        <h1>Сайн байна уу? 👋</h1>

        <p>
            Намайг <span class="name">Хосбаяр</span> гэдэг.
        </p>

        <p>
            Би Монгол Улсын Их Сургуульд
            <span class="subject">Интернет технологийн үндэс</span>
            хичээлийг судалж байгаа.
        </p>

        <p>
            Энэхүү веб хуудсанд тухайн хичээлийн
            даалгавруудаа оруулж явах болно.
        </p>
        <br><a href="lab1.html">Laboratory 1</a>
    </div>

</body>
</html>
